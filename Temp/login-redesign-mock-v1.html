<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voeq — Sign in (Redesign v1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #0F2A1D;
    --amber: #E8A33D;
    --cream: #F6F1E6;
    --ink: #1F2B24;
    --muted: #5B6B60;
    --line: #E3DCCB;
    --surface: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F2EDE0; color: var(--ink); display: flex; min-height: 100vh; align-items: center; justify-content: center; -webkit-font-smoothing: antialiased; padding: 16px; }
  .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 12px 40px rgba(15,42,29,.12); padding: 28px 24px 24px; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; color: var(--forest); margin-bottom: 4px; }
  .brand-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--amber); display: inline-block; }
  .lede { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 600; color: var(--forest); margin-bottom: 4px; }
  .sub { font-size: 13.5px; color: var(--muted); margin-bottom: 20px; }
  /* GOOGLE PRIMARY */
  .btn-google { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1.5px solid #DAD2C2; border-radius: 999px; padding: 12px 16px; font-size: 14.5px; font-weight: 600; color: var(--ink); cursor: pointer; transition: box-shadow .15s; }
  .btn-google:hover { box-shadow: 0 4px 14px rgba(15,42,29,.10); background: #FBFAF6; }
  .g-ico { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 16px; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .inp { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 14px; background: #fff; color: var(--ink); outline: none; }
  .inp:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(232,163,61,.15); }
  .field { margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink); }
  .remember input { accent-color: var(--amber); width: 16px; height: 16px; }
  .forgot { font-size: 12.5px; color: var(--amber); font-weight: 600; text-decoration: none; }
  .btn-email { width: 100%; background: var(--forest); color: var(--cream); border: 0; border-radius: 999px; padding: 13px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .foot { margin-top: 18px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .foot a { color: var(--amber); font-weight: 600; text-decoration: none; }
  .note { margin-top: 16px; background: #FBF5E8; border: 1px solid #EFDDB8; color: #7A5A17; border-radius: 10px; padding: 10px 12px; font-size: 11.5px; display: flex; gap: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="brand-dot"></span>voeq</div>
  <div class="lede">Welcome back</div>
  <div class="sub">Sign in to continue to Voeq.</div>

  <!-- GOOGLE FIRST — no consent gate (already accepted server-side / skip for returning users) -->
  <button class="btn-google"><span class="g-ico">G</span> Continue with Google</button>

  <div class="divider">or with email</div>

  <form>
    <div class="field">
      <label>Email</label>
      <input class="inp" type="email" placeholder="you@campus.edu" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input class="inp" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="row">
      <label class="remember"><input type="checkbox" checked> Keep me signed in</label>
      <a class="forgot" href="#">Forgot password?</a>
    </div>
    <button class="btn-email" type="button">Sign in</button>
  </form>

  <div class="foot">New to Voeq? <a href="#">Create an account</a></div>

  <!-- Only shown when a policy version has changed (rare) — NOT every login -->
  <div class="note">🔒 <span>ToS &amp; Privacy: you&apos;re covered by your earlier acceptance. They only pop up again if our policies change.</span></div>
</div>
</body>
</html>
