<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voeq — Sign in (Redesign v4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #0F2A1D;
    --amber: #E8A33D;
    --ink: #1F2B24;
    --muted: #6B7A70;
    --line: #E3DCCB;
    --surface: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F2EDE0; color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; -webkit-font-smoothing: antialiased; }
  .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 34px rgba(15,42,29,.10); padding: 26px 22px 22px; }
  .brand { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px; color: var(--forest); margin-bottom: 2px; }
  .brand-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--amber); display: inline-block; }
  h1 { font-family: 'Fraunces', serif; font-size: 25px; font-weight: 600; color: var(--forest); margin: 14px 0 4px; }
  .sub { font-size: 13.5px; color: var(--muted); margin-bottom: 18px; }
  /* GOOGLE BRANDS BUTTON — official spec: white, 1px #dadce0, radius 4px,
     Roboto Medium 14px, real 4-color G (18px), hover #f8f9fa */
  .btn-google {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #fff; border: 1px solid #dadce0; border-radius: 4px;
    padding: 12px 16px; height: 48px; cursor: pointer;
    font-family: 'Roboto', 'Arial', sans-serif; font-size: 14px; font-weight: 500;
    color: #3c4043; letter-spacing: .25px;
    transition: background .12s, box-shadow .12s, border-color .12s;
  }
  .btn-google:hover { background: #f8f9fa; box-shadow: 0 1px 2px rgba(60,64,67,.12); }
  .btn-google:active { background: #f1f3f4; }
  .glogo { width: 18px; height: 18px; flex-shrink: 0; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .inp { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 11px; font-size: 14px; background: #fff; color: var(--ink); outline: none; }
  .inp:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(232,163,61,.12); }
  .field { margin-bottom: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 14px; }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink); }
  .remember input { accent-color: var(--amber); width: 15px; height: 15px; }
  .forgot { font-size: 12.5px; color: var(--amber); font-weight: 600; text-decoration: none; }
  .btn-email { width: 100%; background: var(--forest); color: #F6F1E6; border: 0; border-radius: 11px; padding: 13px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .foot { margin-top: 16px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .foot a { color: var(--amber); font-weight: 600; text-decoration: none; }
  .note { margin-top: 14px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; }
  /* Turnstile — same as today's widget footprint */
  .turnstile { display: flex; justify-content: center; margin: 12px 0 14px; }
  .ts-w { width: 100%; max-width: 300px; height: 65px; border: 1px dashed #CFC7B6; border-radius: 10px; background: #FCFBF8; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="brand-dot"></span>voeq</div>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to continue to Voeq.</p>

  <!-- GOOGLE BRANDS button — official 4-color G + Roboto Medium -->
  <button class="btn-google" type="button">
    <svg class="glogo" viewBox="0 0 48 48" focusable="false" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Continue with Google
  </button>
  <div class="note" style="justify-content:flex-start;margin:10px 0 0;">🔒 ToS &amp; Privacy: accepted earlier — only asked again if policies change.</div>

  <div class="divider">or with email</div>

  <form>
    <div class="field">
      <label>Email</label>
      <input class="inp" type="email" placeholder="you@campus.edu" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input class="inp" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="row">
      <label class="remember"><input type="checkbox" checked> Keep me signed in</label>
      <a class="forgot" href="#">Forgot password?</a>
    </div>
    <button class="btn-email" type="button">Sign in</button>
  </form>

  <div class="foot">New to Voeq? <a href="#">Create an account</a></div>
</div>
</body>
</html>
